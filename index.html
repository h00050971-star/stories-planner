<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Планировщик сторис</title>
<style>
  :root{
    --card-w: 300px;
    --bg: #0f1115;
    --panel: #171a21;
    --card: #1e222b;
    --border: #2a2f3a;
    --text: #e9ebf0;
    --muted: #8a90a0;
    --accent: #6c8cff;
    --ready: #3ecf8e;
    --draft: #f2b84b;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  header{
    position: sticky; top:0; z-index: 10;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header h1{ font-size:16px; margin:0; font-weight:600; white-space:nowrap; }
  .spacer{ flex:1; }
  .zoom{ display:flex; align-items:center; gap:8px; }
  .zoom button{ width:34px; height:34px; border-radius:8px; }
  @media (max-width: 700px){
    .zoom{ display:none; }
    main{ padding: 12px; }
    #track{ justify-content:center; }
    .card, #add-card{ width: min(var(--card-w), calc(100vw - 24px)); }
  }
  button{
    background: #262b36; color: var(--text); border:1px solid var(--border);
    border-radius: 8px; padding: 8px 14px; cursor:pointer; font-size:14px;
  }
  button:hover{ background:#2e3442; }
  button.primary{ background: var(--accent); border-color: var(--accent); color:#fff; }
  button.primary:hover{ filter:brightness(1.08); }
  #status-line{ font-size:12px; color:var(--muted); overflow-wrap:anywhere; max-width:100%; min-width:0; }
  #dropzone-hint{ font-size:12px; color:var(--muted); }

  main{ padding: 20px; }
  #page-footer{
    padding: 16px 20px 28px; display:flex; justify-content:center;
    border-top:1px solid var(--border);
  }
  #page-footer button{ font-size:12px; color:var(--muted); }
  #track{
    display:flex; flex-wrap:wrap; gap:14px; align-items:flex-start;
  }
  .card{
    position:relative; width: var(--card-w); aspect-ratio: 9/16;
    background:var(--card); border:1px solid var(--border); border-radius: 14px;
    overflow:hidden; display:flex; flex-direction:column; cursor:grab;
  }
  .card.dragging{ opacity:.4; }
  .card.dragover{ outline: 2px dashed var(--accent); outline-offset:-2px; }
  .card-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:6px 10px; flex-shrink:0;
  }
  .badge{
    background:rgba(255,255,255,.08); color:#fff; font-weight:700; font-size:13px;
    width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  }
  .head-right{ display:flex; align-items:center; gap:8px; }
  .sparkle{ font-size:14px; }
  .status-dot{
    width:10px; height:10px; border-radius:50%; flex-shrink:0;
    background: var(--draft); box-shadow: 0 0 0 2px rgba(0,0,0,.4);
  }
  .status-dot.ready{ background: var(--ready); }
  .media-wrap{ position:relative; flex:1; min-height:0; min-width:0; background:#000; display:flex; align-items:center; justify-content:center; }
  .media-wrap img, .media-wrap video{ width:100%; height:100%; object-fit:cover; }
  .overlay-layer{
    position:absolute; z-index:5; cursor:grab; touch-action:none;
    border:2px solid var(--accent); border-radius:6px; overflow:hidden;
  }
  .overlay-layer.dragging{ cursor:grabbing; opacity:.85; }
  .overlay-layer img, .overlay-layer video{ display:block; width:100%; height:100%; object-fit:cover; pointer-events:none; }
  .overlay-remove{
    position:absolute; top:-10px; right:-10px; z-index:6; width:22px; height:22px; border-radius:50%;
    background:#4a2130; border:1px solid #7a2f45; color:#fff; font-size:12px; line-height:1;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .layer-box{
    flex-shrink:0; display:flex; align-items:center; gap:8px; padding:6px 10px;
    border-top:1px solid var(--border); background:rgba(255,255,255,.03); font-size:11px; color:var(--muted);
  }
  .layer-box button{ font-size:11px; padding:5px 8px; }
  .layer-box input[type=range]{ flex:1; }
  .layer-file-input{ display:none; }
  .empty-slot{
    flex:1; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:8px;
    color:var(--muted); font-size:13px; text-align:center; padding:12px;
  }
  .empty-slot input[type=file]{ display:none; }
  .empty-slot .pick{ padding:6px 12px; font-size:12px; }
  textarea.draft{
    display:block; width:100%; margin:0; flex-shrink:0; box-sizing:border-box;
    background:rgba(255,255,255,.05); color:#fff; border:none; border-top:1px solid var(--border);
    padding:10px; font-size:13px; resize:none; min-height:88px;
    font-family:inherit;
  }
  .card-footer{
    display:flex; align-items:center; gap:6px; padding:8px; border-top:1px solid var(--border); background:var(--panel);
    flex-shrink:0;
  }
  .card-footer .left-group{ display:flex; gap:6px; }
  .card-footer button{ padding:6px 8px; font-size:11px; }
  .card-footer button.ready-btn.is-ready{ background: var(--ready); border-color:var(--ready); color:#06281a; }
  .card-footer button.del-btn:hover{ background:#4a2130; border-color:#7a2f45; }
  .card-footer button.dl-btn{ margin-left:auto; }
  .card-footer button.move-prev::before{ content:"▲"; }
  .card-footer button.move-next::before{ content:"▼"; }
  @media (min-width:701px){
    .card-footer button.move-prev::before{ content:"◀"; }
    .card-footer button.move-next::before{ content:"▶"; }
  }
  .select-check{ width:16px; height:16px; cursor:pointer; }
  .trim-box{
    flex-shrink:0; display:flex; flex-direction:column; gap:6px; padding:8px 10px;
    border-top:1px solid var(--border); background:rgba(255,255,255,.03);
  }
  .trim-box .trim-row{ display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted); }
  .trim-box input[type=number]{
    width:56px; background:#0f1115; color:var(--text); border:1px solid var(--border);
    border-radius:6px; padding:4px 6px; font-size:12px;
  }
  .trim-box button{ font-size:11px; padding:5px 8px; }
  .trim-status{ font-size:11px; color:var(--muted); }
  #toolbar{
    display:flex; gap:8px; align-items:center; padding: 0 20px 14px;
  }
  #toolbar button{ font-size:12px; }
  @media (max-width: 700px){ #toolbar{ padding: 0 12px 12px; flex-wrap:wrap; } }

  #add-card{
    width: var(--card-w); aspect-ratio:9/16; border:2px dashed var(--border); border-radius:14px;
    display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:40px;
    cursor:pointer;
  }
  #add-card.dragover{ border-color:var(--accent); color:var(--accent); }
  #add-card.busy{ font-size:14px; cursor:default; opacity:.6; }
  #file-input{ display:none; }

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:#262b36; border:1px solid var(--border); padding:10px 16px; border-radius:10px;
    font-size:13px; z-index:50; opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .toast.show{ opacity:1; }
</style>
</head>
<body>
<header>
  <h1>📱 Планировщик сторис</h1>
  <div class="zoom">
    <button id="zoom-out" title="Уменьшить">−</button>
    <span id="zoom-label" style="font-size:12px;color:var(--muted);width:40px;text-align:center;">100%</span>
    <button id="zoom-in" title="Увеличить">+</button>
  </div>
  <div id="dropzone-hint">Перетащи фото/видео на карточку, или на «+» в конце ряда</div>
  <div class="spacer"></div>
  <span id="status-line">—</span>
</header>
<div id="toolbar">
  <button id="dl-all-btn">⬇ Скачать всё</button>
  <button id="dl-selected-btn">⬇ Скачать выбранное</button>
  <span id="dl-status" style="font-size:12px;color:var(--muted);"></span>
</div>
<main>
  <div id="track"></div>
</main>
<footer id="page-footer">
  <button id="token-btn">Токен GitHub</button>
</footer>
<div class="toast" id="toast"></div>
<input type="file" id="file-input" accept="image/*,video/*" multiple>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
const OWNER = "h00050971-star";
const REPO = "stories-planner";
const BRANCH = "main";
const API = `https://api.github.com/repos/${OWNER}/${REPO}`;

let manifest = [];
let manifestSha = null;
let zoom = parseInt(localStorage.getItem("sp_zoom") || "100", 10);
let selectedIds = new Set();

function displayPathFor(item){
  return item.trimmedMediaPath || item.finalMediaPath || item.mediaPath;
}
function rawUrlFor(path){
  return `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${path}`;
}

// ---------- обрезка видео прямо в браузере (ffmpeg.wasm) ----------
let ffmpegInstance = null;
let ffmpegLoadPromise = null;
function loadScriptOnce(src){
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = src;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error("Не удалось загрузить " + src));
    document.head.appendChild(s);
  });
}

async function getFFmpeg(onProgress){
  if (ffmpegInstance) return ffmpegInstance;
  if (!ffmpegLoadPromise){
    ffmpegLoadPromise = (async () => {
      if (!window.FFmpegWASM || !window.FFmpegUtil){
        if (onProgress) onProgress("Загружаю библиотеку обрезки…");
        await Promise.all([
          loadScriptOnce("vendor/ffmpeg/ffmpeg.js"),
          loadScriptOnce("vendor/ffmpeg/ffmpeg-util.js"),
        ]);
      }
      const { FFmpeg } = FFmpegWASM;
      const ff = new FFmpeg();
      if (onProgress) ff.on("log", ({ message }) => onProgress(message));
      const base = "vendor/ffmpeg";
      await ff.load({
        coreURL: await FFmpegUtil.toBlobURL(`${base}/ffmpeg-core.js`, "text/javascript"),
        wasmURL: await FFmpegUtil.toBlobURL(`${base}/ffmpeg-core.wasm`, "application/wasm"),
      });
      ffmpegInstance = ff;
      return ff;
    })();
  }
  return await ffmpegLoadPromise;
}

async function trimVideoInBrowser(srcUrl, start, end, ext, onStatus){
  let wakeLock = null;
  try{ wakeLock = await navigator.wakeLock?.request("screen"); }catch(e){}
  onStatus("Гружу обрезчик видео (один раз)…");
  const ff = await getFFmpeg((msg) => onStatus("Режу: " + msg.slice(0, 40)));
  onStatus("Скачиваю исходник…");
  const data = await FFmpegUtil.fetchFile(srcUrl);
  const inName = "in" + ext;
  const outName = "out.mp4";
  await ff.writeFile(inName, data);
  onStatus("Режу видео…");
  try{
    await ff.exec([
      "-i", inName, "-ss", String(start), "-to", String(end),
      "-c:v", "libx264", "-crf", "22", "-preset", "ultrafast",
      "-c:a", "aac", "-movflags", "+faststart", outName,
    ]);
  } finally {
    try{ wakeLock?.release(); }catch(e){}
  }
  const out = await ff.readFile(outName);
  await ff.deleteFile(inName);
  await ff.deleteFile(outName);
  return new Blob([out.buffer], { type: "video/mp4" });
}

async function compressVideoInBrowser(file, onStatus){
  let wakeLock = null;
  try{ wakeLock = await navigator.wakeLock?.request("screen"); }catch(e){}
  onStatus("Гружу сжиматель видео (один раз)…");
  const ff = await getFFmpeg((msg) => onStatus("Сжимаю: " + msg.slice(0, 40)));
  onStatus("Читаю файл…");
  const data = new Uint8Array(await file.arrayBuffer());
  const ext = "." + (file.name.split(".").pop() || "mov").toLowerCase();
  const inName = "in" + ext;
  const outName = "out.mp4";
  await ff.writeFile(inName, data);
  onStatus("Сжимаю видео…");
  try{
    await ff.exec([
      "-i", inName,
      "-vf", "scale=if(gt(iw\\,ih)\\,min(640\\,iw)\\,-2):if(gt(iw\\,ih)\\,-2\\,min(640\\,ih))",
      "-r", "15",
      "-c:v", "libx264", "-crf", "32", "-preset", "ultrafast",
      "-c:a", "aac", "-b:a", "96k", "-movflags", "+faststart", outName,
    ]);
  } finally {
    try{ wakeLock?.release(); }catch(e){}
  }
  const out = await ff.readFile(outName);
  await ff.deleteFile(inName);
  await ff.deleteFile(outName);
  return new Blob([out.buffer], { type: "video/mp4" });
}

// ---------- токен ----------
function getToken(){ return localStorage.getItem("sp_gh_token") || ""; }
function setToken(t){ localStorage.setItem("sp_gh_token", t.trim()); }
function ensureToken(){
  let t = getToken();
  if (!t){
    t = prompt("Вставь GitHub Personal Access Token (fine-grained, доступ только к репозиторию stories-planner, права Contents: Read & Write). Токен сохранится только в этом браузере.");
    if (t) setToken(t);
  }
  return getToken();
}
document.getElementById("token-btn").onclick = () => {
  const t = prompt("GitHub PAT (Contents R/W на репозиторий stories-planner):", getToken());
  if (t !== null) setToken(t);
};

// ---------- GitHub API ----------
function ghHeaders(){
  return {
    "Authorization": `Bearer ${ensureToken()}`,
    "Accept": "application/vnd.github+json",
  };
}

async function ghGetFile(path){
  const r = await fetch(`${API}/contents/${path}?ref=${BRANCH}&t=${Date.now()}`, { headers: ghHeaders(), cache: "no-store" });
  if (r.status === 404) return { content: null, sha: null };
  if (!r.ok) throw new Error(`GET ${path} failed: ${r.status} ${await r.text()}`);
  const j = await r.json();
  return { content: j.content, sha: j.sha, encoding: j.encoding };
}

async function ghPutFile(path, base64Content, message, knownSha){
  let sha = knownSha;
  for (let attempt = 0; attempt < 4; attempt++){
    const body = { message, content: base64Content, branch: BRANCH };
    if (sha) body.sha = sha;
    const r = await fetch(`${API}/contents/${path}`, {
      method: "PUT", headers: { ...ghHeaders(), "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (r.ok) return await r.json();
    if (r.status === 409 || r.status === 422){
      // конфликт версий — перечитать sha и повторить
      const fresh = await ghGetFile(path);
      sha = fresh.sha;
      continue;
    }
    throw new Error(`PUT ${path} failed: ${r.status} ${await r.text()}`);
  }
  throw new Error(`PUT ${path}: не удалось после нескольких попыток (конфликты версий)`);
}

function b64EncodeUnicode(str){
  return btoa(unescape(encodeURIComponent(str)));
}
function b64DecodeUnicode(str){
  return decodeURIComponent(escape(atob(str.replace(/\n/g, ""))));
}

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ---------- манифест ----------
async function loadManifest(){
  setStatus("Загружаю манифест…");
  const { content, sha } = await ghGetFile("manifest.json");
  manifestSha = sha;
  manifest = content ? JSON.parse(b64DecodeUnicode(content)) : [];
  setStatus(`Слотов: ${manifest.length}`);
  render();
}

async function saveManifest(message){
  const b64 = b64EncodeUnicode(JSON.stringify(manifest, null, 1));
  const res = await ghPutFile("manifest.json", b64, message, manifestSha);
  manifestSha = res.content.sha;
}

function nextOrder(){
  return manifest.length ? Math.max(...manifest.map(m => m.order)) + 1 : 1;
}

function moveItem(item, direction){
  const sorted = [...manifest].sort((a, b) => a.order - b.order);
  const idx = sorted.findIndex(m => m.id === item.id);
  const other = sorted[idx + direction];
  if (!other) return;
  const tmp = item.order;
  item.order = other.order;
  other.order = tmp;
  render();
  saveManifest(`Порядок: ${item.id} <-> ${other.id}`).catch(e => toast("Ошибка: " + e.message));
}

function duplicateItem(item){
  const newId = "s" + Date.now() + Math.random().toString(36).slice(2, 7);
  const copy = {
    ...item,
    id: newId,
    order: nextOrder(),
    trimStart: null,
    trimEnd: null,
    trimmedMediaPath: null,
    status: "draft",
  };
  manifest.push(copy);
  render();
  saveManifest(`Дублировано: ${item.id} -> ${newId}`).catch(e => toast("Ошибка: " + e.message));
}

// ---------- UI helpers ----------
function setStatus(s){ document.getElementById("status-line").textContent = s; }
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 2500);
}

function applyZoom(){
  // 100% -> ~5 карточек в ряд на 1920px экране
  const w = Math.round(340 * (100 / zoom));
  document.documentElement.style.setProperty("--card-w", w + "px");
  document.getElementById("zoom-label").textContent = zoom + "%";
  localStorage.setItem("sp_zoom", zoom);
}
document.getElementById("zoom-in").onclick = () => { zoom = Math.min(220, zoom + 15); applyZoom(); };
document.getElementById("zoom-out").onclick = () => { zoom = Math.max(40, zoom - 15); applyZoom(); };
applyZoom();

// ---------- загрузка медиа ----------
const COMPRESS_THRESHOLD = 60 * 1024 * 1024; // выше — сжимаем перед загрузкой (потолок GitHub ~100МБ на файл)

async function uploadFileToSlot(file, existingId){
  const ext = (file.name.split(".").pop() || "bin").toLowerCase();
  const isVideo = file.type.startsWith("video/") || ["mp4","mov","m4v"].includes(ext);
  const id = existingId || ("s" + Date.now() + Math.random().toString(36).slice(2,7));

  let uploadFile = file;
  let uploadExt = ext;
  if (isVideo && file.size > COMPRESS_THRESHOLD){
    try{
      const blob = await compressVideoInBrowser(file, (msg) => setStatus(msg));
      uploadFile = new File([blob], "compressed.mp4", { type: "video/mp4" });
      uploadExt = "mp4";
    }catch(e){
      console.error(e);
      throw new Error("Не удалось сжать видео: " + e.message);
    }
  }

  const path = `media/${id}.${uploadExt}`;
  toast("Загружаю файл в GitHub…");
  const b64 = await fileToBase64(uploadFile);
  await ghPutFile(path, b64, `Загрузка сторис ${id}`, null);
  return { id, path, mediaType: isVideo ? "video" : "image" };
}

let uploading = false;

async function handleNewFiles(fileList){
  if (uploading){ toast("Уже гружу — подожди"); return; }
  uploading = true;
  render();
  const files = Array.from(fileList);
  try{
    for (const file of files){
      try{
        const { id, path, mediaType } = await uploadFileToSlot(file);
        manifest.push({
          id, order: nextOrder(), mediaPath: path, mediaType,
          draftText: "", status: "draft", platforms: [],
        });
        render();
      }catch(e){
        console.error(e);
        toast("Ошибка загрузки: " + e.message);
      }
    }
    try{
      await saveManifest(`Добавлено сторис: ${files.length}`);
      toast("Сохранено");
      setStatus(`Слотов: ${manifest.length}`);
    }catch(e){
      toast("Ошибка сохранения манифеста: " + e.message);
    }
  } finally {
    uploading = false;
    render();
  }
}

document.getElementById("file-input").onchange = (e) => {
  handleNewFiles(e.target.files);
  e.target.value = "";
};

const addCard = () => {
  const el = document.createElement("div");
  el.id = "add-card";
  if (uploading){
    el.classList.add("busy");
    el.textContent = "Гружу…";
    return el;
  }
  el.textContent = "+";
  el.onclick = () => { if (!uploading) document.getElementById("file-input").click(); };
  ["dragenter","dragover"].forEach(ev => el.addEventListener(ev, e => { e.preventDefault(); el.classList.add("dragover"); }));
  ["dragleave","drop"].forEach(ev => el.addEventListener(ev, e => { e.preventDefault(); el.classList.remove("dragover"); }));
  el.addEventListener("drop", e => { if (e.dataTransfer.files.length) handleNewFiles(e.dataTransfer.files); });
  return el;
};

// ---------- рендер ----------
let saveDraftTimers = {};

function debounceSaveDraft(id, text){
  clearTimeout(saveDraftTimers[id]);
  saveDraftTimers[id] = setTimeout(async () => {
    const item = manifest.find(m => m.id === id);
    if (!item) return;
    item.draftText = text;
    try{ await saveManifest(`Черновик текста: ${id}`); toast("Текст сохранён"); }
    catch(e){ toast("Ошибка сохранения текста: " + e.message); }
  }, 1200);
}

// ---------- скачивание ----------
async function fetchAsBlob(path){
  const r = await fetch(rawUrlFor(path) + `?t=${Date.now()}`);
  if (!r.ok) throw new Error(`Скачивание ${path} не удалось: ${r.status}`);
  return await r.blob();
}

function triggerBlobDownload(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function mimeFor(filename){
  const ext = filename.split(".").pop().toLowerCase();
  const map = { mp4:"video/mp4", mov:"video/quicktime", m4v:"video/x-m4v",
    jpg:"image/jpeg", jpeg:"image/jpeg", png:"image/png", webp:"image/webp", gif:"image/gif" };
  return map[ext] || "application/octet-stream";
}

async function downloadOne(item, btnEl){
  const path = displayPathFor(item);
  if (!path){ toast("Нечего скачивать — слот пуст"); return; }
  const filename = path.split("/").pop();
  try{
    toast("Скачиваю…");
    const blob = await fetchAsBlob(path);
    const file = new File([blob], filename, { type: blob.type || mimeFor(filename) });
    // сетевая загрузка съедает время между тапом и вызовом — Safari может уже не считать
    // это действием пользователя и тихо откажет в шеринге. Поэтому: файл уже готов,
    // а реальный share() вызываем по СЛЕДУЮЩЕМУ тапу — без всякой задержки перед ним.
    // Только на телефоне — на компе "поделиться" не нужно, там должен быть обычный файл в Загрузки.
    const isMobile = window.matchMedia("(pointer: coarse)").matches || window.matchMedia("(max-width:700px)").matches;
    if (isMobile && btnEl && navigator.canShare && navigator.canShare({ files: [file] })){
      btnEl.textContent = "💾";
      btnEl.title = "Сохранить в галерею";
      btnEl.onclick = async () => {
        try{
          await navigator.share({ files: [file] });
        }catch(shareErr){
          if (shareErr.name !== "AbortError") triggerBlobDownload(blob, filename);
        }
        btnEl.textContent = "⬇";
        btnEl.title = "Скачать";
        btnEl.onclick = () => downloadOne(item, btnEl);
      };
      toast("Готово — нажми ещё раз, сохранит в галерею");
      return;
    }
    triggerBlobDownload(blob, filename);
    toast("Скачано");
  }catch(e){ toast("Ошибка: " + e.message); }
}

async function downloadMany(items, zipName){
  if (!items.length){ toast("Нечего скачивать"); return; }
  const dlStatus = document.getElementById("dl-status");
  const zip = new JSZip();
  let done = 0;
  for (const item of items){
    const path = displayPathFor(item);
    if (!path) continue;
    dlStatus.textContent = `Качаю ${++done}/${items.length}…`;
    try{
      const blob = await fetchAsBlob(path);
      zip.file(path.split("/").pop(), blob);
    }catch(e){ console.error(e); }
  }
  dlStatus.textContent = "Собираю архив…";
  const content = await zip.generateAsync({ type: "blob" });
  triggerBlobDownload(content, zipName);
  dlStatus.textContent = "Готово";
  setTimeout(() => { dlStatus.textContent = ""; }, 3000);
}

document.getElementById("dl-all-btn").onclick = () => {
  downloadMany([...manifest].sort((a,b) => a.order - b.order), "stories.zip");
};
document.getElementById("dl-selected-btn").onclick = () => {
  const items = manifest.filter(m => selectedIds.has(m.id)).sort((a,b) => a.order - b.order);
  if (!items.length){ toast("Ничего не выбрано — отметь галочки на карточках"); return; }
  downloadMany(items, "stories_selected.zip");
};

// ---------- обрезка видео ----------
// Реальную обрезку (ffmpeg) делает отдельный скрипт trim_video.py — здесь только
// задаются точки "с/по" и сохраняются в манифест, обработка идёт по команде.
function fmtTime(s){
  s = Math.max(0, s || 0);
  const m = Math.floor(s / 60);
  const r = (s % 60).toFixed(1).padStart(4, "0");
  return `${m}:${r}`;
}

function makeTrimBox(item, videoEl){
  const box = document.createElement("div");
  box.className = "trim-box";

  let duration = videoEl && videoEl.duration && isFinite(videoEl.duration) ? videoEl.duration : 0;
  let from = item.trimStart != null ? item.trimStart : 0;
  let to = item.trimEnd != null ? item.trimEnd : (duration || 0);

  // визуальная шкала
  const track = document.createElement("div");
  track.className = "trim-track";
  track.style.cssText = "position:relative;height:28px;background:#0f1115;border:1px solid var(--border);border-radius:6px;cursor:pointer;";

  const range = document.createElement("div");
  range.style.cssText = "position:absolute;top:0;bottom:0;background:rgba(108,140,255,.35);border-left:2px solid var(--accent);border-right:2px solid var(--accent);";
  track.appendChild(range);

  const handleStart = document.createElement("div");
  handleStart.style.cssText = "position:absolute;top:-2px;bottom:-2px;width:10px;margin-left:-5px;background:var(--accent);border-radius:3px;cursor:ew-resize;touch-action:none;";
  track.appendChild(handleStart);

  const handleEnd = document.createElement("div");
  handleEnd.style.cssText = "position:absolute;top:-2px;bottom:-2px;width:10px;margin-left:-5px;background:var(--accent);border-radius:3px;cursor:ew-resize;touch-action:none;";
  track.appendChild(handleEnd);

  box.appendChild(track);

  const row = document.createElement("div");
  row.className = "trim-row";

  const fromInput = document.createElement("input");
  fromInput.type = "number"; fromInput.min = "0"; fromInput.step = "0.1";

  const toInput = document.createElement("input");
  toInput.type = "number"; toInput.min = "0"; toInput.step = "0.1";

  const setBtn = document.createElement("button");
  setBtn.textContent = "◀ с текущего";
  setBtn.title = "Взять текущее время плеера как начало";

  const setEndBtn = document.createElement("button");
  setEndBtn.textContent = "текущего ▶";
  setEndBtn.title = "Взять текущее время плеера как конец";

  row.appendChild(document.createTextNode("с"));
  row.appendChild(fromInput);
  row.appendChild(document.createTextNode("по"));
  row.appendChild(toInput);
  row.appendChild(setBtn);
  row.appendChild(setEndBtn);
  box.appendChild(row);

  const applyRow = document.createElement("div");
  applyRow.className = "trim-row";
  const applyBtn = document.createElement("button");
  applyBtn.textContent = "✂ Обрезать";
  applyBtn.className = "primary";
  const undoBtn = document.createElement("button");
  undoBtn.textContent = "↺ отменить";
  undoBtn.title = "Вернуть исходное видео (до обрезки)";
  undoBtn.style.display = "none";
  const status = document.createElement("span");
  status.className = "trim-status";
  applyRow.appendChild(applyBtn);
  applyRow.appendChild(undoBtn);
  applyRow.appendChild(status);
  box.appendChild(applyRow);

  undoBtn.onclick = async () => {
    item.trimmedMediaPath = null;
    item.trimStart = null;
    item.trimEnd = null;
    render();
    try{ await saveManifest(`Обрезка отменена: ${item.id}`); toast("Вернул исходное видео"); }
    catch(e){ toast("Ошибка: " + e.message); }
  };

  function refreshUI(){
    fromInput.value = from.toFixed(1);
    toInput.value = to.toFixed(1);
    if (duration > 0){
      const lp = Math.min(100, Math.max(0, (from / duration) * 100));
      const rp = Math.min(100, Math.max(0, (to / duration) * 100));
      handleStart.style.left = lp + "%";
      handleEnd.style.left = rp + "%";
      range.style.left = lp + "%";
      range.style.right = (100 - rp) + "%";
    }
    status.textContent = item.trimmedMediaPath ? "✂ обрезано (готово)"
      : (item.trimStart != null && item.trimEnd != null) ? "Ожидает обрезки…" : `${fmtTime(from)} – ${fmtTime(to)}`;
    undoBtn.style.display = item.trimmedMediaPath ? "" : "none";
  }

  function setDuration(d){
    duration = d;
    if (item.trimEnd == null) to = duration;
    refreshUI();
  }
  if (videoEl){
    if (videoEl.duration && isFinite(videoEl.duration)) setDuration(videoEl.duration);
    videoEl.addEventListener("loadedmetadata", () => setDuration(videoEl.duration));
  }

  function timeFromClientX(clientX){
    const rect = track.getBoundingClientRect();
    const frac = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
    return frac * (duration || 0);
  }

  function dragHandle(handleEl, isStart){
    handleEl.addEventListener("pointerdown", (e) => {
      e.preventDefault(); e.stopPropagation();
      handleEl.setPointerCapture(e.pointerId);
      const onMove = (ev) => {
        const t = timeFromClientX(ev.clientX);
        if (isStart){ from = Math.min(t, to - 0.1); if (from < 0) from = 0; }
        else { to = Math.max(t, from + 0.1); if (to > duration) to = duration; }
        if (videoEl) videoEl.currentTime = isStart ? from : to;
        refreshUI();
      };
      const onUp = () => {
        handleEl.removeEventListener("pointermove", onMove);
        handleEl.removeEventListener("pointerup", onUp);
        saveTrimPoints();
      };
      handleEl.addEventListener("pointermove", onMove);
      handleEl.addEventListener("pointerup", onUp);
    });
  }
  dragHandle(handleStart, true);
  dragHandle(handleEnd, false);

  track.addEventListener("click", (e) => {
    if (e.target === handleStart || e.target === handleEnd) return;
    const t = timeFromClientX(e.clientX);
    if (videoEl) videoEl.currentTime = t;
  });

  fromInput.onchange = () => {
    from = Math.min(parseFloat(fromInput.value) || 0, to - 0.1);
    refreshUI(); saveTrimPoints();
  };
  toInput.onchange = () => {
    to = Math.max(parseFloat(toInput.value) || 0, from + 0.1);
    if (duration > 0) to = Math.min(to, duration);
    refreshUI(); saveTrimPoints();
  };
  setBtn.onclick = (e) => { e.preventDefault(); if (videoEl){ from = Math.min(videoEl.currentTime, to - 0.1); refreshUI(); } };
  setEndBtn.onclick = (e) => { e.preventDefault(); if (videoEl){ to = Math.max(videoEl.currentTime, from + 0.1); refreshUI(); } };

  let saveTimer = null;
  function saveTrimPoints(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      item.trimStart = from; item.trimEnd = to;
      item.trimmedMediaPath = null;
      refreshUI();
      try{ await saveManifest(`Точки обрезки: ${item.id} (${from.toFixed(1)}-${to.toFixed(1)}с)`); }
      catch(e){ toast("Ошибка: " + e.message); }
    }, 500);
  }

  applyBtn.onclick = async () => {
    if (to <= from){ toast("Конец должен быть позже начала"); return; }
    item.trimStart = from; item.trimEnd = to;
    applyBtn.disabled = true;
    const srcPath = item.mediaPath;
    const ext = "." + srcPath.split(".").pop();
    try{
      status.textContent = "Готовлю…";
      const blob = await trimVideoInBrowser(rawUrlFor(srcPath), from, to, ext, (msg) => { status.textContent = msg; });
      status.textContent = "Загружаю результат в GitHub…";
      const b64 = await fileToBase64(new File([blob], "trim.mp4", { type: "video/mp4" }));
      const outPath = `media/${item.id}_trim${Date.now()}.mp4`;
      await ghPutFile(outPath, b64, `Обрезка: ${item.id}`, null);
      item.trimmedMediaPath = outPath;
      await saveManifest(`Видео обрезано: ${item.id} (${from.toFixed(1)}-${to.toFixed(1)}с)`);
      toast("Готово — видео обрезано");
      render();
    }catch(e){
      console.error(e);
      status.textContent = "Ошибка обрезки";
      toast("Ошибка обрезки: " + e.message);
    } finally {
      applyBtn.disabled = false;
    }
  };

  refreshUI();
  return box;
}

// ---------- слой (второе медиа поверх фона) ----------
let overlayDebounce = {};
function saveOverlayDebounced(item){
  clearTimeout(overlayDebounce[item.id]);
  overlayDebounce[item.id] = setTimeout(async () => {
    try{ await saveManifest(`Слой обновлён: ${item.id}`); }
    catch(e){ toast("Ошибка: " + e.message); }
  }, 400);
}

function makeOverlayLayer(item, mediaWrap){
  const ov = item.overlay;
  const layer = document.createElement("div");
  layer.className = "overlay-layer";

  function applyPos(){
    layer.style.left = (ov.x * 100) + "%";
    layer.style.top = (ov.y * 100) + "%";
    layer.style.width = (ov.w * 100) + "%";
    layer.style.aspectRatio = "1 / 1";
    layer.style.transform = "translate(-50%,-50%)";
  }
  applyPos();

  const rawUrl = rawUrlFor(ov.mediaPath);
  if (ov.mediaType === "video"){
    const v = document.createElement("video");
    v.src = rawUrl; v.muted = true; v.playsInline = true; v.loop = true; v.autoplay = true;
    layer.appendChild(v);
  } else {
    const img = document.createElement("img");
    img.src = rawUrl;
    layer.appendChild(img);
  }

  const removeBtn = document.createElement("div");
  removeBtn.className = "overlay-remove";
  removeBtn.textContent = "✕";
  removeBtn.title = "Убрать слой";
  removeBtn.onclick = async (e) => {
    e.preventDefault(); e.stopPropagation();
    item.overlay = null;
    render();
    try{ await saveManifest(`Слой убран: ${item.id}`); }
    catch(err){ toast("Ошибка: " + err.message); }
  };
  layer.appendChild(removeBtn);

  layer.addEventListener("pointerdown", (e) => {
    if (e.target === removeBtn) return;
    e.preventDefault(); e.stopPropagation();
    layer.classList.add("dragging");
    layer.setPointerCapture(e.pointerId);
    const onMove = (ev) => {
      const rect = mediaWrap.getBoundingClientRect();
      ov.x = Math.min(1, Math.max(0, (ev.clientX - rect.left) / rect.width));
      ov.y = Math.min(1, Math.max(0, (ev.clientY - rect.top) / rect.height));
      applyPos();
    };
    const onUp = () => {
      layer.classList.remove("dragging");
      layer.removeEventListener("pointermove", onMove);
      layer.removeEventListener("pointerup", onUp);
      saveOverlayDebounced(item);
    };
    layer.addEventListener("pointermove", onMove);
    layer.addEventListener("pointerup", onUp);
  });

  return layer;
}

async function uploadOverlayFile(item, file){
  const ext = (file.name.split(".").pop() || "bin").toLowerCase();
  const isVideo = file.type.startsWith("video/") || ["mp4","mov","m4v"].includes(ext);
  const path = `media/${item.id}_overlay_${Date.now()}.${ext}`;
  toast("Загружаю слой…");
  const b64 = await fileToBase64(file);
  await ghPutFile(path, b64, `Слой для ${item.id}`, null);
  item.overlay = { mediaPath: path, mediaType: isVideo ? "video" : "image", x: 0.5, y: 0.35, w: 0.5 };
  await saveManifest(`Слой добавлен: ${item.id}`);
  render();
  toast("Слой добавлен — перетащи по превью, чтобы разместить");
}

function makeLayerBox(item){
  const box = document.createElement("div");
  box.className = "layer-box";

  const input = document.createElement("input");
  input.type = "file"; input.accept = "image/*,video/*";
  input.className = "layer-file-input";
  input.onchange = (e) => {
    if (e.target.files[0]) uploadOverlayFile(item, e.target.files[0]).catch(err => toast("Ошибка: " + err.message));
    e.target.value = "";
  };
  box.appendChild(input);

  if (!item.overlay){
    const addBtn = document.createElement("button");
    addBtn.textContent = "🖼️+ добавить слой";
    addBtn.title = "Наложить второе фото/видео поверх этого";
    addBtn.onclick = () => input.click();
    box.appendChild(addBtn);
  } else {
    const label = document.createElement("span");
    label.textContent = "размер слоя";
    box.appendChild(label);

    const slider = document.createElement("input");
    slider.type = "range"; slider.min = "15"; slider.max = "100"; slider.step = "1";
    slider.value = Math.round(item.overlay.w * 100);
    slider.oninput = () => {
      item.overlay.w = parseInt(slider.value, 10) / 100;
      const layer = box.parentElement.querySelector(".overlay-layer");
      if (layer) layer.style.width = (item.overlay.w * 100) + "%";
    };
    slider.onchange = () => saveOverlayDebounced(item);
    box.appendChild(slider);

    const replaceBtn = document.createElement("button");
    replaceBtn.textContent = "заменить";
    replaceBtn.onclick = () => input.click();
    box.appendChild(replaceBtn);
  }

  return box;
}

function makeCard(item, index){
  const card = document.createElement("div");
  card.className = "card";
  card.dataset.id = item.id;

  const head = document.createElement("div");
  head.className = "card-head";

  const badge = document.createElement("div");
  badge.className = "badge";
  badge.textContent = index + 1;
  head.appendChild(badge);

  const headRight = document.createElement("div");
  headRight.className = "head-right";
  const check = document.createElement("input");
  check.type = "checkbox";
  check.className = "select-check";
  check.title = "Выбрать для скачивания";
  check.checked = selectedIds.has(item.id);
  check.onclick = (e) => e.stopPropagation();
  check.onchange = () => {
    if (check.checked) selectedIds.add(item.id); else selectedIds.delete(item.id);
  };
  headRight.appendChild(check);
  if (item.finalMediaPath){
    const sparkle = document.createElement("span");
    sparkle.className = "sparkle";
    sparkle.textContent = "✨";
    sparkle.title = "Текст оформлен";
    headRight.appendChild(sparkle);
  }
  const dot = document.createElement("div");
  dot.className = "status-dot" + (item.status === "ready" ? " ready" : "");
  headRight.appendChild(dot);
  head.appendChild(headRight);

  card.appendChild(head);

  const mediaWrap = document.createElement("div");
  mediaWrap.className = "media-wrap";
  const displayPath = displayPathFor(item);
  let videoEl = null;
  if (displayPath){
    const rawUrl = rawUrlFor(displayPath);
    if (item.mediaType === "video"){
      const v = document.createElement("video");
      v.src = rawUrl; v.controls = true; v.muted = false; v.playsInline = true;
      mediaWrap.appendChild(v);
      videoEl = v;
    } else {
      const img = document.createElement("img");
      img.src = rawUrl;
      mediaWrap.appendChild(img);
    }
  } else {
    const empty = document.createElement("div");
    empty.className = "empty-slot";
    empty.textContent = "Пусто — перетащи файл сюда";
    mediaWrap.appendChild(empty);
  }
  if (item.overlay && item.overlay.mediaPath){
    mediaWrap.appendChild(makeOverlayLayer(item, mediaWrap));
  }

  card.appendChild(mediaWrap);

  if (item.mediaType === "video" && item.mediaPath){
    card.appendChild(makeTrimBox(item, videoEl));
  }

  card.appendChild(makeLayerBox(item, mediaWrap));

  const ta = document.createElement("textarea");
  ta.className = "draft";
  ta.placeholder = "Текст на сторис…";
  ta.value = item.draftText || "";
  ta.oninput = () => debounceSaveDraft(item.id, ta.value);
  card.appendChild(ta);

  const footer = document.createElement("div");
  footer.className = "card-footer";

  const leftGroup = document.createElement("div");
  leftGroup.className = "left-group";

  const readyBtn = document.createElement("button");
  readyBtn.className = "ready-btn" + (item.status === "ready" ? " is-ready" : "");
  readyBtn.textContent = item.status === "ready" ? "✓ готово" : "к публикации";
  readyBtn.onclick = async () => {
    item.status = item.status === "ready" ? "draft" : "ready";
    render();
    try{ await saveManifest(`Статус ${item.id}: ${item.status}`); toast("Статус обновлён"); }
    catch(e){ toast("Ошибка: " + e.message); }
  };
  leftGroup.appendChild(readyBtn);

  const moveUpBtn = document.createElement("button");
  moveUpBtn.className = "move-prev";
  moveUpBtn.title = "Переместить раньше";
  moveUpBtn.onclick = () => moveItem(item, -1);
  leftGroup.appendChild(moveUpBtn);

  const moveDownBtn = document.createElement("button");
  moveDownBtn.className = "move-next";
  moveDownBtn.title = "Переместить позже";
  moveDownBtn.onclick = () => moveItem(item, 1);
  leftGroup.appendChild(moveDownBtn);

  const dupBtn = document.createElement("button");
  dupBtn.textContent = "⧉";
  dupBtn.title = "Дублировать (второй момент из того же видео)";
  dupBtn.onclick = () => duplicateItem(item);
  leftGroup.appendChild(dupBtn);

  const delBtn = document.createElement("button");
  delBtn.className = "del-btn";
  delBtn.textContent = "✕";
  delBtn.title = "Удалить слот";
  delBtn.onclick = async () => {
    if (!confirm("Удалить эту сторис из планировщика?")) return;
    manifest = manifest.filter(m => m.id !== item.id);
    render();
    try{ await saveManifest(`Удалён слот ${item.id}`); toast("Удалено"); }
    catch(e){ toast("Ошибка: " + e.message); }
  };
  leftGroup.appendChild(delBtn);

  footer.appendChild(leftGroup);

  const dlBtn = document.createElement("button");
  dlBtn.className = "dl-btn";
  dlBtn.textContent = "⬇";
  dlBtn.title = "Скачать";
  dlBtn.onclick = () => downloadOne(item, dlBtn);
  footer.appendChild(dlBtn);

  card.appendChild(footer);

  // drag&drop замены медиа
  ["dragenter","dragover"].forEach(ev => card.addEventListener(ev, e => {
    if (e.dataTransfer.types.includes("Files")){ e.preventDefault(); card.classList.add("dragover"); }
  }));
  ["dragleave"].forEach(ev => card.addEventListener(ev, () => card.classList.remove("dragover")));
  card.addEventListener("drop", async (e) => {
    if (!e.dataTransfer.files.length) return;
    e.preventDefault(); card.classList.remove("dragover");
    const file = e.dataTransfer.files[0];
    try{
      const { path, mediaType } = await uploadFileToSlot(file, item.id);
      item.mediaPath = path; item.mediaType = mediaType;
      render();
      await saveManifest(`Заменено медиа: ${item.id}`);
      toast("Медиа обновлено");
    }catch(err){ toast("Ошибка: " + err.message); }
  });

  return card;
}

function render(){
  const track = document.getElementById("track");
  track.innerHTML = "";
  const sorted = [...manifest].sort((a,b) => a.order - b.order);
  sorted.forEach((item, i) => track.appendChild(makeCard(item, i)));
  track.appendChild(addCard());
}

loadManifest().catch(e => { setStatus("Ошибка загрузки: " + e.message); console.error(e); });
</script>
